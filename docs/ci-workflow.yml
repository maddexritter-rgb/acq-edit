name: Source and state checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:distribution
      - run: python3 -m unittest discover -s tests -p '*_test.py'
