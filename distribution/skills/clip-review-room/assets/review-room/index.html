<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip review</title><link rel="stylesheet" href="room.css"></head>
<body><header><div class="brand"><span class="mark">▸</span><span id="batch"></span><span id="progress-label"></span></div><div class="header-actions"><span id="save" role="status">Loading…</span><details class="menu"><summary aria-label="Room options">•••</summary><div class="menu-body"><button id="copy-review-path">Copy review file path</button><button id="export">Export decisions ↗</button><p>Y / R / N · Decide<br>← → · Navigate<br>Space · Play / pause</p></div></details></div></header><progress id="progress" value="0" max="10" aria-label="Review progress"></progress><div class="preview-banner" id="context"></div><span id="title" hidden></span><span id="description" hidden></span>
<div class="workspace"><aside><div class="queue-heading"><h2>Clips <span id="total"></span></h2><button id="search-toggle" aria-label="Search clips" aria-expanded="false">⌕</button><span id="queue-count" hidden></span></div><input hidden id="search" type="search" placeholder="Search titles or notes…" aria-label="Search clips"><nav id="filters" aria-label="Filter clips"></nav><div id="queue" role="list" aria-label="Clip queue"></div></aside><main id="main"><div class="viewer-head"><div><p id="clip-label" class="eyebrow"></p><h2 id="clip-title"></h2></div><div class="navigation"><button id="previous" aria-label="Previous clip">←</button><button id="next" aria-label="Next clip">→</button></div></div><div class="review-body"><div class="player-column"><div class="version-toolbar"><div id="versions" aria-label="Compare versions"></div><span id="playback-label"></span></div><div class="stage"><video id="video" controls playsinline preload="metadata"></video><p id="media-error" role="alert" hidden>Video unavailable. Check the local media file or open the source.</p></div><p id="compare-hint"></p></div><section class="review-panel"><section id="revision-history" aria-label="Previous version feedback" hidden></section><div class="panel-top"><p class="eyebrow">YOUR CALL</p><span id="status"></span></div><div class="decisions"><button data-decision="yes">Yes <kbd>Y</kbd></button><button data-decision="maybe">Revise <kbd>R</kbd></button><button data-decision="no">No <kbd>N</kbd></button></div><div class="timestamp-heading"><span>Time notes</span><button id="add-time">+ Add at 0:00</button></div><div id="time-notes"></div><form id="time-form" hidden><label id="time-label" for="time-text"></label><textarea id="time-text" placeholder="What should change here?" required></textarea><div class="time-form-actions"><button type="submit">Save note</button><button type="button" id="cancel-time">Cancel</button></div></form><label for="notes" id="notes-label">Notes</label><textarea id="notes" placeholder="What works? What needs changing?"></textarea><div class="note-footer"><span>Saved as you type</span><button id="clear">Clear decision</button></div><details><summary>Transcript</summary><p id="transcript"></p></details><details><summary>Clip details</summary><dl id="details"></dl><a id="source" target="_blank" rel="noopener">Open original source ↗</a></details></section></div></main></div><div id="toast" role="status"></div><script src="room.js" defer></script></body></html>
